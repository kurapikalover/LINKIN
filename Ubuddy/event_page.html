<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ÜBuddy</title>

  <!-- Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Home and notification icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,notifications,search,filter_alt">

  <!-- Base CSS -->
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="event_page.css">
  
</head>

<body>

  <div class="page">

    <!-- =========================
         TOP TABS
    ========================== -->
    <nav class="tabs">

      <a href="homepage.html" class="tab-icon material-symbols-outlined">
        home
      </a>

      <a href="#" class="tab-icon-bell material-symbols-outlined">
        notifications
      </a>

      <span class="spacer"></span>

      <a href="#" class="tab">
        My Activity
      </a>

      <a href="#" class="tab">
        My Applications
      </a>

      <a href="#" class="tab">
        My Achievements
      </a>

    </nav>


    <!-- =========================
         MAIN WHITE SHEET
    ========================== -->
    <div class="sheet">

      <!-- =========================
           HEADER
      ========================== -->
      <header class="header">

        <!-- Logo -->
        <div class="logo">
          ÜBuddy
          <small>Let UBuddy be your buddy</small>
        </div>


        <!-- Student Profile -->
        <div class="user">

          <div class="user-info">
            <strong>Student Name</strong>

            <small>
              2486023 ·
              <a href="#">View Profile</a>
            </small>
          </div>

          <div class="avatar">
            <!-- Profile image will go here later -->
          </div>

        </div>

      </header>


      <!-- =========================
           PAGE CONTENT
           Individual pages go here
      ========================== -->
      <main class="page-content">

        <div class="events-page">

          <a href="homepage.html" class="back-button">← Home</a>

          <h1 class="events-title">Events</h1>

          <div class="search-bar">

            <div class="search-input">

              <span class="material-symbols-outlined search-icon">
                search
              </span>

              <input
                type="text"
                id="searchInput"
                placeholder="Search"
              >

            </div>

            <button
              type="button"
              class="filter-btn material-symbols-outlined"
              title="Filter by category"
            >
              filter_alt
            </button>

          </div>

          <div class="event-grid">

            <a href="#" class="event-card">
              <div class="event-card-image">
                Event Image
              </div>

              <h2>Opening Ceremony</h2>
            </a>

            <a href="#" class="event-card">
              <div class="event-card-image">
                Event Image
              </div>

              <h2>Yukata Workshop</h2>
            </a>

            <a href="#" class="event-card">
              <div class="event-card-image">
                Event Image
              </div>

              <h2>Silat Workshop</h2>
            </a>

            <a href="#" class="event-card">
              <div class="event-card-image">
                Event Image
              </div>

              <h2>Origami Workshop</h2>
            </a>

            <a href="#" class="event-card">
              <div class="event-card-image">
                Event Image
              </div>

              <h2>Movie Night</h2>
            </a>

          </div>

        </div>

      </main>

    </div>

  </div>
  <script src="event_page.js"></script>
</body>
</html>
